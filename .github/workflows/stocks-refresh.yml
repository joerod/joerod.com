name: Refresh stock quote snapshot

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: joerod-swa-production
  cancel-in-progress: false

jobs:
  refresh_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stock quotes
        run: node scripts/update-stock-snapshot.js

      - name: Deploy site and quote snapshot
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_MUD_0C2A8650F }}
          action: upload
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true
